<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img" aria-labelledby="memblock-title"><title id="memblock-title">memblock：内存范围与预留范围可以重叠</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536781"/></marker></defs><rect width="1100" height="1000" fill="white"/><polyline points="430.0,190 430,240 280,240 280.0,300" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="670.0,190 670,240 820,240 820.0,300" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="280.0,390 280.0,480" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="820.0,390 820.0,480" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="280.0,560 280.0,660" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="820.0,560 820.0,660" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="550.0,750 550.0,830" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><text x="550.0" y="50.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">memblock：内存范围与预留范围可以重叠</tspan></text><rect x="350" y="110" width="400" height="80" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="550.0" y="137.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">struct memblock</tspan><tspan x="550.0" dy="26">早期物理内存区间管理</tspan></text><rect x="70" y="300" width="420" height="90" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="280.0" y="332.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="280.0" dy="0">memory : memblock_type</tspan><tspan x="280.0" dy="26">cnt / regions / total_size</tspan></text><rect x="610" y="300" width="420" height="90" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="820.0" y="332.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="820.0" dy="0">reserved : memblock_type</tspan><tspan x="820.0" dy="26">cnt / regions / total_size</tspan></text><rect x="70" y="480" width="420" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="280.0" y="507.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="280.0" dy="0">memblock_region[]</tspan><tspan x="280.0" dy="26">base / size / flags / nid</tspan></text><rect x="610" y="480" width="420" height="80" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="820.0" y="507.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="820.0" dy="0">memblock_region[]</tspan><tspan x="820.0" dy="26">已分配或预留的地址区间</tspan></text><rect x="70" y="660" width="960" height="90" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="550.0" y="692.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">可分配候选区间 ≈ memory − reserved</tspan><tspan x="550.0" dy="26">还须满足对齐、地址限制、节点与属性等条件</tspan></text><rect x="70" y="830" width="960" height="80" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="550.0" y="857.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">早期分配成功 → 登记到 reserved</tspan><tspan x="550.0" dy="26">例如 crash kernel、页描述符和节点管理结构</tspan></text></svg>