<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1160" viewBox="0 0 1100 1160" role="img" aria-labelledby="buddy-title"><title id="buddy-title">伙伴系统：申请 8 KiB 时的拆分与释放合并</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536781"/></marker></defs><rect width="1100" height="1160" fill="white"/><polyline points="270.0,190 270.0,280" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="270.0,360 270.0,450" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="270.0,530 270.0,620" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="270.0,700 270.0,810" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="480,660.0 650,660.0" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="480,850.0 650,850.0" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="840.0,700 840.0,810" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="840.0,890 840.0,980" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><text x="550.0" y="50.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">伙伴系统：申请 8 KiB 时的拆分与释放合并</tspan></text><rect x="60" y="110" width="420" height="80" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="270.0" y="137.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="270.0" dy="0">申请 order 1：8 KiB</tspan><tspan x="270.0" dy="26">假设基本页为 4 KiB</tspan></text><rect x="60" y="280" width="420" height="80" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="270.0" y="307.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="270.0" dy="0">free_area[1] 无可用块</tspan><tspan x="270.0" dy="26">向更高阶查找</tspan></text><rect x="60" y="450" width="420" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="270.0" y="477.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="270.0" dy="0">free_area[2] 找到 16 KiB</tspan><tspan x="270.0" dy="26">取出这个连续物理块</tspan></text><rect x="60" y="620" width="420" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="270.0" y="647.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="270.0" dy="0">拆成两个 8 KiB 伙伴</tspan><tspan x="270.0" dy="26">A 与 B 的物理地址相邻且满足对齐</tspan></text><rect x="60" y="810" width="420" height="80" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="270.0" y="837.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="270.0" dy="0">A：交给申请者</tspan><tspan x="270.0" dy="26">当前不在空闲链表</tspan></text><rect x="650" y="620" width="380" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="840.0" y="647.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="840.0" dy="0">B：仍为空闲</tspan><tspan x="840.0" dy="26">放回 free_area[1]</tspan></text><rect x="650" y="810" width="380" height="80" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="840.0" y="837.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="840.0" dy="0">释放 A，并检查 B</tspan><tspan x="840.0" dy="26">同阶、空闲、同 Zone 等条件满足</tspan></text><rect x="60" y="980" width="970" height="80" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="545.0" y="1007.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="545.0" dy="0">合并为 order 2 的 16 KiB 块</tspan><tspan x="545.0" dy="26">继续尝试更高阶合并；否则加入相应空闲链表</tspan></text><text x="550.0" y="1110.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="16"><tspan x="550.0" dy="0">这是基本模型，省略水位、迁移类型与每 CPU 页缓存等路径；相邻块不一定互为伙伴。</tspan></text></svg>