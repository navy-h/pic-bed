<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" role="img" aria-labelledby="hierarchy-title"><title id="hierarchy-title">物理页管理：Node → Zone → 按阶组织空闲块</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536781"/></marker></defs><rect width="1100" height="1100" fill="white"/><polyline points="340.0,190 340,240 200,240 200.0,300" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="550.0,190 550.0,300" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="760.0,190 760,240 900,240 900.0,300" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="200.0,380 200.0,480" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="550.0,380 550.0,480" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="900.0,380 900.0,480" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="200.0,560 200.0,660" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="550.0,560 550.0,660" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="900.0,560 900.0,660" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="200.0,740 200.0,830" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="550.0,740 550.0,830" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="900.0,740 900.0,830" fill="none" stroke="#536781" stroke-width="1.8" marker-end="url(#arrow)"/><text x="550.0" y="50.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">物理页管理：Node → Zone → 按阶组织空闲块</tspan></text><rect x="250" y="110" width="600" height="80" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="550.0" y="137.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">node_data[nid] → pglist_data</tspan><tspan x="550.0" dy="26">Node 表示 NUMA 局部性分组</tspan></text><rect x="60" y="300" width="280" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="200.0" y="327.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="200.0" dy="0">ZONE_DMA</tspan><tspan x="200.0" dy="26">低地址约束</tspan></text><rect x="410" y="300" width="280" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="550.0" y="327.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">ZONE_DMA32</tspan><tspan x="550.0" dy="26">32 位 DMA 地址约束</tspan></text><rect x="760" y="300" width="280" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="900.0" y="327.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="900.0" dy="0">ZONE_NORMAL</tspan><tspan x="900.0" dy="26">常规物理内存</tspan></text><rect x="60" y="480" width="980" height="80" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="550.0" y="507.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">每个 Zone 各自维护 free_area[order]</tspan><tspan x="550.0" dy="26">下面以一个 Zone 展开</tspan></text><rect x="60" y="660" width="280" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="200.0" y="687.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="200.0" dy="0">order 0</tspan><tspan x="200.0" dy="26">1 页 / 块</tspan></text><rect x="410" y="660" width="280" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="550.0" y="687.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">order 1</tspan><tspan x="550.0" dy="26">2 页 / 块</tspan></text><rect x="760" y="660" width="280" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="900.0" y="687.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="900.0" dy="0">order k</tspan><tspan x="900.0" dy="26">2^k 页 / 块</tspan></text><rect x="60" y="830" width="980" height="90" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="550.0" y="862.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="550.0" dy="0">每阶的 free_list 按迁移类型分组</tspan><tspan x="550.0" dy="26">如 UNMOVABLE / RECLAIMABLE / MOVABLE → 空闲块首页描述符</tspan></text><text x="550.0" y="1015.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="16"><tspan x="550.0" dy="0">struct page 描述物理页。Node 不一定等于 CPU 插槽；并非每个 Node 都有全部 Zone。</tspan></text></svg>