tspan x="270.0" dy="0">E820 表</tspan><tspan x="270.0" dy="26">地址、长度、类型</tspan></text><rect x="60" y="440" width="420" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="270.0" y="467.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="270.0" dy="0">memblock 区间管理</tspan><tspan x="270.0" dy="26">memory / reserved</tspan></text><rect x="650" y="120" width="380" height="80" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="840.0" y="147.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="840.0" dy="0">ACPI：SRAT / SLIT</tspan><tspan x="840.0" dy="26">资源亲和性与节点距离</tspan></text><rect x="650" y="440" width="380" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="840.0" y="467.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="840.0" dy="0">NUMA 初始化</tspan><tspan x="840.0" dy="26">给区间关联 nid，申请 Node 对象</tspan></text><rect x="60" y="640" width="970" height="80" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="545.0" y="667.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="545.0" dy="0">页管理初始化</tspan><tspan x="545.0" dy="26">struct page、Node、Zone 等元数据</tspan></text><rect x="60" y="800" width="970" height="80" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="545.0" y="827.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="18"><tspan x="545.0" dy="0">memblock_free_all</tspan><tspan x="545.0" dy="26">可释放页 → 对应 Zone 的伙伴空闲链表</tspan></text><text x="550.0" y="945.0" text-anchor="middle" dominant-baseline="middle" fill="#16203a" font-family="Microsoft YaHei, sans-serif" font-size="16"><tspan x="550.0" dy="0">这是功能依赖概览；实际初始化调用相互交织。保留区不会因交接而自动成为空闲页。</tspan></text></svg>